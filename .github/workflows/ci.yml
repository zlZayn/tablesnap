# CI —— 只读质检：不写回仓库，不做任何发布动作。
#
# 为什么 runner 是 windows-latest（而不是 ubuntu）：
#   源码 screen.py 直接 `from mss import mss`，selector.py / hotkey.py 直接
#   `import keyboard`，测试会 import 到这些模块。keyboard 在 Linux 上需要
#   root 权限访问 /dev/input，可靠做法是与 imagora / rpa_snap_locate 一致走 Windows。
#
# 已知不确定项（首跑才知道）：
#   tests/test_vlm.py 用 urllib 打外部接口，CI 上可能因缺凭据/外网而红。
#   若首跑红：报告后按结果调整（例如按 pytest marker 跳过该文件），不擅自删测试。
#
# 三条判据的单一来源：
#   - Ruff 版本来自 pyproject.toml 的 [dependency-groups] dev，锁在 uv.lock；
#   - Python 版本来自仓内 .python-version（由 uv 解析）；
#   - 安装统一 `uv sync --frozen`：锁文件与 pyproject 不同步时直接红。
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Ruff · Pytest (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies (frozen)
        run: uv sync --frozen --group dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      # 本仓 tests/ 有 3 个 test_*.py（含依赖测试数据的 test_end_to_end / test_xlsx）。
      - name: Pytest
        run: uv run pytest
