[project]
name = "tablesnap"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1.0",
    "Pillow>=9.0.0",
    "mss>=6.0.0",
    "keyboard>=0.13.0",
    "rich>=14.3.4",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.0",
    "ruff>=0.16.9",
]

[tool.ruff]
# 不碰 Markdown 里嵌的 Python 片段：文档与笔记正文不属格式化范围
extend-exclude = ["*.md"]
