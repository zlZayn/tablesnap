[project]
name = "tablesnap"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1.0",
    "Pillow>=9.0.0",
    "mss>=6.0.0",
    "keyboard>=0.13.0",
    "rich>=14.3.4",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.0",
    "ruff>=0.16.9",
]

[tool.uv]
# 锁文件源固定为官方 PyPI，且此处优先级高于本机 ~/AppData/Roaming/uv/uv.toml。
# 不加这一段时，本机全局 index-url 指向镜像，任何一次 `uv lock` 都会把 uv.lock
# 的 registry 整片改写成镜像源，境外 CI 拉镜像会 tcp 超时、uv sync --frozen 失败。
# 注：`default-index` 字段 uv 0.11 不认（报 unknown field 并整体忽略该节），
# 必须用下面的 [[tool.uv.index]] 表。
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
[tool.ruff]
# 不碰 Markdown 里嵌的 Python 片段：文档与笔记正文不属格式化范围
extend-exclude = ["*.md"]
